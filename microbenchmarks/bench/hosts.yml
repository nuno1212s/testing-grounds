# Cluster inventory for remote deployments.
# Replicas: 1-to-1 mapping (one replica process per machine, node_id required).
# Clients: N-to-X mapping (N_CLIENTS processes distributed round-robin across X machines).
# Edit to match your actual cluster. See microbenchmarks-async/bench/hosts.yml for a reference.

replicas:
  hosts:
    node0:
      ansible_host: node0
      ansible_user: nneto
      node_id: 0
      machine_ip: 192.168.1.100
    node1:
      ansible_host: node1
      ansible_user: nneto
      node_id: 1
      machine_ip: 192.168.1.101
    node2:
      ansible_host: node2
      ansible_user: nneto
      node_id: 2
      machine_ip: 192.168.1.102
    node3:
      ansible_host: node3
      ansible_user: nneto
      node_id: 3
      machine_ip: 192.168.1.103

clients:
  hosts:
    client0:
      ansible_host: client0
      ansible_user: nneto
      machine_ip: 192.168.1.110
