# wan-global-5region — five regions, one replica each. Run with N_REPLICAS=5.
#
#   make <project> local WAN_ENABLED=1 WAN_PROFILE=wan-global-5region N_REPLICAS=5
#
# Remember `make <project> regen-ca-root` after changing N_REPLICAS.
# With 5 replicas (f=1, quorum 4) every decision spans at least three regions,
# so the tail of the RTT distribution — not the mean — drives consensus latency.

defaults:
  jitter_ms: 0
  loss_pct: 0.01
  rate: 1gbit

placement:
  "replica-0": us-east
  "replica-1": us-west
  "replica-2": eu-west
  "replica-3": ap-northeast
  "replica-4": sa-east
  "client-*": us-east

intra_region:
  rtt_ms: 1
  jitter_ms: 0.2

links:
  - { a: us-east,      b: us-west,      rtt_ms: 62,  jitter_ms: 3 }
  - { a: us-east,      b: eu-west,      rtt_ms: 78,  jitter_ms: 4 }
  - { a: us-east,      b: ap-northeast, rtt_ms: 145, jitter_ms: 8 }
  - { a: us-east,      b: sa-east,      rtt_ms: 115, jitter_ms: 6 }
  - { a: us-west,      b: eu-west,      rtt_ms: 135, jitter_ms: 7 }
  - { a: us-west,      b: ap-northeast, rtt_ms: 98,  jitter_ms: 5 }
  - { a: us-west,      b: sa-east,      rtt_ms: 176, jitter_ms: 9 }
  - { a: eu-west,      b: ap-northeast, rtt_ms: 212, jitter_ms: 11 }
  - { a: eu-west,      b: sa-east,      rtt_ms: 181, jitter_ms: 9 }
  - { a: ap-northeast, b: sa-east,      rtt_ms: 256, jitter_ms: 13 }

overrides: []
schedule: []
