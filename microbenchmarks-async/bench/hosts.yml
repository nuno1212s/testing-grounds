# Cluster inventory for remote deployments.
# Replicas: 1-to-1 mapping (one replica process per machine, node_id required).
# Clients: N-to-X mapping (N_CLIENTS processes distributed round-robin across X machines,
#          no node_id here — computed by generator scripts from N_CLIENTS in bench.env).

replicas:
  hosts:
    theia221:
      ansible_host: theia221
      ansible_user: nneto
      node_id: 0
      machine_ip: 192.168.70.221
    theia222:
      ansible_host: theia222
      ansible_user: nneto
      node_id: 1
      machine_ip: 192.168.70.222
    theia223:
      ansible_host: theia223
      ansible_user: nneto
      node_id: 2
      machine_ip: 192.168.70.223
    theia224:
      ansible_host: theia224
      ansible_user: nneto
      node_id: 3
      machine_ip: 192.168.70.224

clients:
  hosts:
    theia225:
      ansible_host: theia225
      ansible_user: nneto
      machine_ip: 192.168.70.225
    theia226:
      ansible_host: theia226
      ansible_user: nneto
      machine_ip: 192.168.70.226
    theia227:
      ansible_host: theia227
      ansible_user: nneto
      machine_ip: 192.168.70.227
