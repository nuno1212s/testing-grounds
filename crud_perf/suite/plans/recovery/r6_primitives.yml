name: r6_primitives
scenario: primitives
description: >
  R6 -- the two recovery primitives timed on their own, with no executor and no messaging.
  State::clone (the real type) is what dual_state pays on every backtrack; the delta re-merge is
  what both CRUD executors pay. Answers "how long does rebuilding a cached state take" directly,
  and decomposes the end-to-end times from R1: the clone should account for most of dual_state's
  state-size dependence, and the re-merge for the CRUD executors' small, state-independent cost.
seed: 20261031
executors: [primitives]
process_factors:
  state_keys: [1000, 10000, 100000, 1000000, 10000000]
  value_bytes: [64]
bench_args:
  depths: [8, 32, 128, 512]
  batch_sizes: [100, 1000]
  write_pct: 50
  trials: 30
  timeout_s: 60
cpus: "40-47"
