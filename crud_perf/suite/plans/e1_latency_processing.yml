name: e1_latency_processing
extends: _base.yml
description: >
  E1 -- the headline grid. Client-observed latency of every variant as the round trip between
  replicas (rtt_ms) and the per-request processing cost (op_cost_us) are varied independently,
  at low offered load (5 clients x 3 outstanding requests = 15 in flight) so that queueing does
  not mask the effect. Speculation can hide at most min(execution time of the batch, one
  replica round trip) of latency per batch, so the gain should appear along the diagonal where
  the two are comparable and vanish when either is ~0.

factors:
  rtt_ms: [0.4, 5, 20, 50, 100, 200]
  op_cost_us: [0, 100, 1000, 5000, 20000]
